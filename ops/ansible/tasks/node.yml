---
- name: Validate pinned Node version
  ansible.builtin.assert:
    that: node_version is match('^24\.[0-9]+\.[0-9]+$')
- name: Create download and runtime directories
  ansible.builtin.file:
    path: '{{ ops_directory }}/{{ item }}'
    state: directory
    mode: '0700'
  loop: [downloads, runtime]
- name: Download Node with its official SHA256 checksum
  ansible.builtin.get_url:
    url: 'https://nodejs.org/dist/v{{ node_version }}/node-v{{ node_version }}-linux-x64.tar.gz'
    dest: '{{ ops_directory }}/downloads/node-v{{ node_version }}-linux-x64.tar.gz'
    checksum: 'sha256:https://nodejs.org/dist/v{{ node_version }}/SHASUMS256.txt'
    mode: '0600'
- name: Extract verified Node archive once
  ansible.builtin.unarchive:
    src: '{{ ops_directory }}/downloads/node-v{{ node_version }}-linux-x64.tar.gz'
    dest: '{{ ops_directory }}/runtime'
    remote_src: true
    creates: '{{ ops_directory }}/runtime/node-v{{ node_version }}-linux-x64/bin/node'
